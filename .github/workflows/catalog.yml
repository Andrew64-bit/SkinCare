name: Catalogo settimanale

on:
  schedule:
    - cron: "17 4 * * 1"   # ogni lunedì 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  build-catalog:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Costruisci il catalogo da Open Beauty Facts (read-only, entro i rate limit)
        working-directory: Tools/catalog-builder
        run: >
          swift run -c release catalog-builder build
          --out ../../docs/catalog/catalog.json
          --per-category 100 --max-pages 5
          --images-dir ../../docs/images
          --images-base-url "https://andrew64-bit.github.io/SkinCare/images/"
          --user-agent "SkinCareCatalogBuilder/0.1 (+https://github.com/Andrew64-bit/SkinCare)"

      - name: Verifica di qualità (QUALITY=PASS obbligatorio)
        working-directory: Tools/catalog-builder
        run: swift run -c release catalog-builder verify ../../docs/catalog/catalog.json

      - name: Allinea lo snapshot incluso nell'app
        run: cp docs/catalog/catalog.json Packages/SkinCareKit/Sources/SkinCareKit/Resources/catalog.json

      - name: Test del Kit sullo snapshot
        working-directory: Packages/SkinCareKit
        run: swift test

      - name: Commit e push del catalogo aggiornato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/catalog/catalog.json docs/images Packages/SkinCareKit/Sources/SkinCareKit/Resources/catalog.json
          if git diff --cached --quiet; then echo "nessun cambiamento"; exit 0; fi
          git commit -m "Catalogo: aggiornamento automatico $(date -u +%Y-%m-%d)"
          git push
